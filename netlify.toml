[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  VITE_BASE_PATH = "/northgate"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/northgate/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Vite emits files into dist/assets, while the app is mounted at /northgate.
# Rewrite asset requests before the SPA fallback or browsers receive index.html
# for module scripts and reject them due to MIME type.
[[redirects]]
  from = "/northgate/assets/*"
  to = "/assets/:splat"
  status = 200
  force = true

# SPA fallback — every route serves index.html so deep links resolve.
# This site sits behind the rnsolutions.net proxy; see DEPLOY.md.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
